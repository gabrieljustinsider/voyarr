name: Add issues and PRs to project board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    name: Add to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v0.5.0
        with:
          # URL specified in your VOYARR_PLAN.md
          project-url: https://github.com/users/gabrieljustinsider/projects/1
          github-token: ${{ secrets.PAT_PROJECT_SYNC }}