name: Build and Publish Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'package.json'
      - '.github/workflows/publish-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: gabrieljustinsider/voyarr-backend

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: vars
        run: |
          VERSION=$(jq -r .version package.json | tr -d '[:space:]')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="1.18.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json | tr -d '[:space:]')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="1.18.0"
          fi
          echo "Current Version: v$VERSION"
          
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Updating details..."
            gh release edit "v$VERSION" --notes "Automated update of built backend artifacts and container images."
          else
            echo "Creating a new GitHub release v$VERSION..."
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
