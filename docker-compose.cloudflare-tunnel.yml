services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: voyarr-cloudflared
    restart: unless-stopped
    command: tunnel --config /app/config/cloudflared.yml run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - voyarr-config:/app/config:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voyarr_network
