services:
  db:
    image: postgres:15-alpine
    container_name: voyarr-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyarr}
      POSTGRES_USER: ${POSTGRES_USER:-voyarr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyarr_password}
      TZ: ${TZ:-UTC}
    volumes:
      - voyarr-db-data:/var/lib/postgresql/data
      - voyarr-backups:/backups
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-voyarr_user} -d $${POSTGRES_DB:-voyarr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - voyarr_network

  redis:
    image: redis:7-alpine
    container_name: voyarr-redis
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${REDIS_PORT:-}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voyarr_network

  browserless:
    image: browserless/chrome:latest
    container_name: voyarr-browserless
    environment:
      - TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=10
      - TOKEN=${BROWSERLESS_TOKEN:-voyarr-secure-browserless-token}
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - voyarr_network

  backend:
    image: voyarr-backend:latest
    build:
      context: ./backend
    container_name: voyarr-backend
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - BROWSERLESS_URL=${BROWSERLESS_URL:-ws://browserless:3000}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-voyarr-secure-browserless-token}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/storage}
      - DEFAULT_DOWNLOAD_PATH=${DEFAULT_DOWNLOAD_PATH:-/media/storage/downloads}
      - MASTER_KEY=${MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - AUTO_PORT_FALLBACK=${AUTO_PORT_FALLBACK:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TZ=${TZ:-UTC}
    volumes:
      # Use custom volume for configuration, host path bindings for media
      - voyarr-config:/app/config
      - voyarr-backups:/app/backups
      - ${MEDIA_ROOT_1:-./media}:/media/storage
      - ${MEDIA_ROOT_2:-./media_alt1}:/media/storage_alt1
      - ${MEDIA_ROOT_3:-./media_alt2}:/media/storage_alt2
    ports:
      - "${PORT:-}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voyarr_network

  celery_worker:
    image: voyarr-backend:latest
    build:
      context: ./backend
    container_name: voyarr-celery
    user: "${PUID:-1000}:${PGID:-1000}"
    command: sh -c "mkdir -p /media/storage/logs && celery -A celery_app.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} --logfile=/media/storage/logs/celery.log"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - BROWSERLESS_URL=${BROWSERLESS_URL:-ws://browserless:3000}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-voyarr-secure-browserless-token}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/storage}
      - DEFAULT_DOWNLOAD_PATH=${DEFAULT_DOWNLOAD_PATH:-/media/storage/downloads}
      - MASTER_KEY=${MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=${TZ:-UTC}
    volumes:
      - voyarr-config:/app/config
      - voyarr-backups:/app/backups
      - ${MEDIA_ROOT_1:-./media}:/media/storage
      - ${MEDIA_ROOT_2:-./media_alt1}:/media/storage_alt1
      - ${MEDIA_ROOT_3:-./media_alt2}:/media/storage_alt2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - voyarr_network

  frontend:
    image: voyarr-frontend:latest
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: voyarr-frontend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - TZ=${TZ:-UTC}
    ports:
      - "${FRONTEND_PORT:-}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voyarr_network

networks:
  voyarr_network:
    driver: bridge

volumes:
  voyarr-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DATA_PATH:-./db/data}
  voyarr-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CONFIG_ROOT:-./config}
  voyarr-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_ROOT:-./backups}