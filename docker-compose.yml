services:
  # ==============================================================================
  # 🔒 VPN SIDECAR SERVICE (GLUETUN) - OPTIONAL
  # ==============================================================================
  # Uncomment this entire block to route your application traffic securely through a VPN.
  # When active, YOU MUST ALSO:
  # 1. Uncomment the `network_mode: "service:vpn"` lines in browserless, backend, celery, and frontend.
  # 2. Comment out the `ports` and `networks` blocks in those services (Gluetun handles them).
  # 3. Uncomment the VPN routing overrides in your .env file (BROWSERLESS_URL and HOST).
  # vpn:
  #   image: qmcgaw/gluetun:latest
  #   container_name: voyarr-vpn
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   environment:
  #     - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-mullvad}
  #     - VPN_TYPE=${VPN_TYPE:-wireguard}
  #     - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
  #     - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-10.64.0.1/32}
  #     - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Sweden}
  #     - DOT=${VPN_DOT:-on}
  #     - DNS_KEEP_NAMESERVER=${VPN_DNS_KEEP_NAMESERVER:-on}
  #   ports:
  #     - "${PORT:-8000}:8000"
  #     - "${FRONTEND_PORT:-80}:80"
  #     - "3000:3000"
  #   restart: unless-stopped
  #   networks:
  #     - voyarr_network

  db:
    image: postgres:15-alpine
    container_name: voyarr-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyarr}
      POSTGRES_USER: ${POSTGRES_USER:-voyarr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyarr_password}
      TZ: ${TZ:-UTC}
    volumes:
      - voyarr-db-data:/var/lib/postgresql/data
      - voyarr-backups:/backups
    ports:
      - "${POSTGRES_PORT:-}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-voyarr_user} -d $${POSTGRES_DB:-voyarr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - voyarr_network

  redis:
    image: redis:7-alpine
    container_name: voyarr-redis
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${REDIS_PORT:-}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voyarr_network

  browserless:
    image: browserless/chrome:latest
    container_name: voyarr-browserless
    # 🔒 VPN CONFIGURATION: Uncomment next line to route through VPN
    # network_mode: "service:vpn"
    environment:
      - TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=10
      - TOKEN=${BROWSERLESS_TOKEN:-voyarr-secure-browserless-token}
    # 🔒 VPN CONFIGURATION: Comment out the `ports` block below if using VPN
    ports:
      - "3000:3000"
    restart: unless-stopped
    # 🔒 VPN CONFIGURATION: Uncomment the block below if using VPN
    # depends_on:
    #   - vpn
    # 🔒 VPN CONFIGURATION: Comment out the `networks` block below if using VPN
    networks:
      - voyarr_network

  backend:
    image: ghcr.io/gabrieljustinsider/voyarr-backend:latest
    container_name: voyarr-backend
    user: "${PUID:-1000}:${PGID:-1000}"
    # 🔒 VPN CONFIGURATION: Uncomment next line to route through VPN
    # network_mode: "service:vpn"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - BROWSERLESS_URL=${BROWSERLESS_URL:-ws://browserless:3000}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-voyarr-secure-browserless-token}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/storage}
      - DEFAULT_DOWNLOAD_PATH=${DEFAULT_DOWNLOAD_PATH:-/media/storage/downloads}
      - MASTER_KEY=${MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - ROOT_PATH=${ROOT_PATH:-}
      - AUTO_PORT_FALLBACK=${AUTO_PORT_FALLBACK:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TZ=${TZ:-UTC}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
    volumes:
      # Use custom volume for configuration, host path bindings for media
      - voyarr-config:/app/config
      - voyarr-backups:/app/backups
      - voyarr-certs:/app/certs:ro
      - ${MEDIA_ROOT_1:-${APP_ROOT:-/opt/voyarr}/media}:/media/storage
      - ${MEDIA_ROOT_2:-${APP_ROOT:-/opt/voyarr}/media_alt1}:/media/storage_alt1
      - ${MEDIA_ROOT_3:-${APP_ROOT:-/opt/voyarr}/media_alt2}:/media/storage_alt2
    # 🔒 VPN CONFIGURATION: Comment out the `ports` block below if using VPN
    ports:
      - "${PORT:-}:8000"
    depends_on:
      db:
        condition: service_healthy
      # 🔒 VPN CONFIGURATION: Uncomment the next two lines if using VPN
      # vpn:
      #   condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 🔒 VPN CONFIGURATION: Comment out the `networks` block below if using VPN
    networks:
      - voyarr_network

  celery_worker:
    image: ghcr.io/gabrieljustinsider/voyarr-backend:latest
    container_name: voyarr-celery
    user: "${PUID:-1000}:${PGID:-1000}"
    # 🔒 VPN CONFIGURATION: Uncomment next line to route through VPN
    # network_mode: "service:vpn"
    command: sh -c "mkdir -p /media/storage/logs && celery -A celery_app.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} --logfile=/media/storage/logs/celery.log"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - BROWSERLESS_URL=${BROWSERLESS_URL:-ws://browserless:3000}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-voyarr-secure-browserless-token}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/storage}
      - DEFAULT_DOWNLOAD_PATH=${DEFAULT_DOWNLOAD_PATH:-/media/storage/downloads}
      - MASTER_KEY=${MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=${TZ:-UTC}
    volumes:
      - voyarr-config:/app/config
      - voyarr-backups:/app/backups
      - ${MEDIA_ROOT_1:-${APP_ROOT:-/opt/voyarr}/media}:/media/storage
      - ${MEDIA_ROOT_2:-${APP_ROOT:-/opt/voyarr}/media_alt1}:/media/storage_alt1
      - ${MEDIA_ROOT_3:-${APP_ROOT:-/opt/voyarr}/media_alt2}:/media/storage_alt2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 🔒 VPN CONFIGURATION: Uncomment the next two lines if using VPN
      # vpn:
      #   condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # 🔒 VPN CONFIGURATION: Comment out the `networks` block below if using VPN
    networks:
      - voyarr_network

  celery_beat:
    image: ghcr.io/gabrieljustinsider/voyarr-backend:latest
    container_name: voyarr-celery-beat
    user: "${PUID:-1000}:${PGID:-1000}"
    # 🔒 VPN CONFIGURATION: Uncomment next line to route through VPN
    # network_mode: "service:vpn"
    command: sh -c "celery -A celery_app.celery_app beat --loglevel=${CELERY_LOG_LEVEL:-info} --pidfile=/tmp/celerybeat.pid"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - TZ=${TZ:-UTC}
    volumes:
      - voyarr-config:/app/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 🔒 VPN CONFIGURATION: Uncomment the next two lines if using VPN
      # vpn:
      #   condition: service_started
    # 🔒 VPN CONFIGURATION: Comment out the `networks` block below if using VPN
    networks:
      - voyarr_network

  frontend:
    image: ghcr.io/gabrieljustinsider/voyarr-frontend:latest
    container_name: voyarr-frontend
    # 🔒 VPN CONFIGURATION: Uncomment next line to route through VPN
    # network_mode: "service:vpn"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - TZ=${TZ:-UTC}
    # 🔒 VPN CONFIGURATION: Comment out the `ports` block below if using VPN
    ports:
      - "${FRONTEND_PORT:-}:80"
    depends_on:
      backend:
        condition: service_healthy
      # 🔒 VPN CONFIGURATION: Uncomment the next two lines if using VPN
      # vpn:
      #   condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 🔒 VPN CONFIGURATION: Comment out the `networks` block below if using VPN
    networks:
      - voyarr_network

networks:
  voyarr_network:
    driver: bridge

volumes:
  voyarr-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DATA_PATH:-${APP_ROOT:-/opt/voyarr}/db/data}
  voyarr-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CONFIG_ROOT:-${APP_ROOT:-/opt/voyarr}/config}
  voyarr-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_ROOT:-${APP_ROOT:-/opt/voyarr}/backups}
  voyarr-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CERTS_ROOT:-${APP_ROOT:-/opt/voyarr}/certs}