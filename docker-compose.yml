version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: voyarr-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyarr}
      POSTGRES_USER: ${POSTGRES_USER:-voyarr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyarr_password}
    volumes:
      - voyarr_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - voyarr_network

  redis:
    image: redis:7-alpine
    container_name: voyarr-redis
    ports:
      - "6379:6379"
    networks:
      - voyarr_network

  backend:
    build: ./backend
    container_name: voyarr-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-voyarr}}
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/storage}
      - MASTER_KEY=${MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ${MEDIA_ROOT:-./media}:/media/storage
      - ./backend:/app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      - db
    networks:
      - voyarr_network

  celery_worker:
    build: ./backend
    container_name: voyarr-celery
    command: sh -c "mkdir -p /media/storage/logs && celery -A celery_app.celery_app worker --loglevel=info --logfile=/media/storage/logs/celery.log"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-voyarr}}
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/storage}
    volumes:
      - ${MEDIA_ROOT:-./media}:/media/storage
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks:
      - voyarr_network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_MASTER_KEY=${MASTER_KEY}
        - VITE_API_BASE=${API_BASE:-http://localhost:8000}
    container_name: voyarr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voyarr_network

volumes:
  voyarr_db_data:

networks:
  voyarr_network:
    driver: bridge