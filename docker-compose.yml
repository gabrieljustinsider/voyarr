name: voyarr
services:
  db:
    image: postgres:15-alpine
    container_name: voyarr-db
    command: postgres -c shared_buffers=256MB -c max_connections=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyarr}
      POSTGRES_USER: ${POSTGRES_USER:-voyarr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyarr_password}
      TZ: ${TZ:-UTC}
    volumes:
      - voyarr-db-data:/var/lib/postgresql/data
      - voyarr-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-voyarr_user} -d $${POSTGRES_DB:-voyarr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - voyarr_network

  redis:
    image: redis:7-alpine
    container_name: voyarr-redis
    command: redis-server --save 60 1 --loglevel warning --tcp-backlog 128
    environment:
      - TZ=${TZ:-UTC}
    # ports:
    #   - "${REDIS_PORT:-6379}:6379" # Optional: Uncomment to expose Redis to host (e.g. for RedisInsight)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voyarr_network

  # -------------------------------------------------------------------------
  # browserless — Optional local headless Chrome for scraping.
  # By default this service is DISABLED to save ~4.6 GB of disk/RAM.
  #
  # Option A (recommended): Use a hosted instance (browserless.io free tier
  #   or self-hosted on another machine) and set in your .env:
  #     BROWSERLESS_URL=wss://chrome.browserless.io
  #     BROWSERLESS_TOKEN=your_api_token
  #
  # Option B: Run locally by starting with the profile flag:
  #     docker compose --profile browserless up -d
  # -------------------------------------------------------------------------
  browserless:
    image: browserless/chrome:latest
    container_name: voyarr-browserless
    profiles:
      - browserless
    environment:
      - TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=10
      - TOKEN=${BROWSERLESS_TOKEN:-voyarr-secure-browserless-token}
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - voyarr_network

  backend:
    image: ghcr.io/gabrieljustinsider/voyarr-backend:latest
    container_name: voyarr-backend
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${SUPPLEMENTARY_GID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:5432/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - BROWSERLESS_URL=${BROWSERLESS_URL:-wss://chrome.browserless.io}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CONTAINER_MEDIA_PATHS=${CONTAINER_MEDIA_PATHS:-/media/storage}
      - DEFAULT_DOWNLOAD_PATH=${DEFAULT_DOWNLOAD_PATH:-/media/storage/downloads}
      - MASTER_KEY=${MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HOST=${HOST:-0.0.0.0}
      - PORT=8000
      - ROOT_PATH=${ROOT_PATH:-}
      - AUTO_PORT_FALLBACK=${AUTO_PORT_FALLBACK:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TZ=${TZ:-UTC}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
      - TRUST_FORWARDED_FOR=${TRUST_FORWARDED_FOR:-false}
      - DEFAULT_USER_AGENT=${DEFAULT_USER_AGENT:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY:-}
      - DISCORD_ADMIN_CHANNEL_ID=${DISCORD_ADMIN_CHANNEL_ID:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - voyarr-config:/app/config
      - voyarr-backups:/app/backups
      - voyarr-certs:/app/certs:ro
      - ${HOST_MEDIA_PATH_1:-./media}:/media/storage
      # - ${HOST_MEDIA_PATH_2:-./media_alt1}:/media/storage_alt1  # Optional additional media path. Uncomment if needed.
      # - ${HOST_MEDIA_PATH_3:-./media_alt2}:/media/storage_alt2  # Optional additional media path. Uncomment if needed.
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000" # Optional: Uncomment to expose the raw API to your host network.
    #                                  # For security isolation details, troubleshooting, and specific use cases
    #                                  # for uncommenting, see the Ports section in README.md or Section 7 in TROUBLESHOOTING.md.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voyarr_network

  x-celery-worker: &celery-worker
    image: ghcr.io/gabrieljustinsider/voyarr-backend:latest
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${SUPPLEMENTARY_GID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:5432/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - BROWSERLESS_URL=${BROWSERLESS_URL:-wss://chrome.browserless.io}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CONTAINER_MEDIA_PATHS=${CONTAINER_MEDIA_PATHS:-/media/storage}
      - DEFAULT_DOWNLOAD_PATH=${DEFAULT_DOWNLOAD_PATH:-/media/storage/downloads}
      - MASTER_KEY=${MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=${TZ:-UTC}
      - TRUST_FORWARDED_FOR=${TRUST_FORWARDED_FOR:-false}
      - DEFAULT_USER_AGENT=${DEFAULT_USER_AGENT:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY:-}
      - DISCORD_ADMIN_CHANNEL_ID=${DISCORD_ADMIN_CHANNEL_ID:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - voyarr-config:/app/config
      - voyarr-backups:/app/backups
      - ${HOST_MEDIA_PATH_1:-./media}:/media/storage
      # - ${HOST_MEDIA_PATH_2:-./media_alt1}:/media/storage_alt1  # Optional additional media path. Uncomment if needed.
      # - ${HOST_MEDIA_PATH_3:-./media_alt2}:/media/storage_alt2  # Optional additional media path. Uncomment if needed.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voyarr_network

  celery_worker:
    <<: *celery-worker
    container_name: voyarr-celery
    shm_size: "2gb"
    command: sh -c "mkdir -p /media/storage/logs && celery -A celery_app.celery_app worker -Q celery,downloads,transcodes,scraping,ai_inference --concurrency=${CELERY_CONCURRENCY:-4} --loglevel=${CELERY_LOG_LEVEL:-info} --logfile=/media/storage/logs/celery.log"
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery_beat:
    image: ghcr.io/gabrieljustinsider/voyarr-backend:latest
    container_name: voyarr-celery-beat
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${SUPPLEMENTARY_GID:-1000}"
    command: sh -c "celery -A celery_app.celery_app beat --loglevel=${CELERY_LOG_LEVEL:-info} --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-voyarr_user}:${POSTGRES_PASSWORD:-voyarr_password}@db:5432/${POSTGRES_DB:-voyarr}}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - TZ=${TZ:-UTC}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - voyarr-config:/app/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voyarr_network

  frontend:
    image: ghcr.io/gabrieljustinsider/voyarr-frontend:latest
    container_name: voyarr-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voyarr_network

networks:
  voyarr_network:
    name: voyarr_prod_network
    driver: bridge

volumes:
  voyarr-db-data:
    name: voyarr-db-data
  voyarr-config:
    name: voyarr-config
  voyarr-backups:
    name: voyarr-backups
  voyarr-certs:
    name: voyarr-certs