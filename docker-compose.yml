version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jizzarr-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jizzarr}
      POSTGRES_USER: ${POSTGRES_USER:-jizzarr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jizzarr_password}
    volumes:
      - jizzarr_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - jizzarr_network

  backend:
    build: ./backend
    container_name: jizzarr-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-jizzarr_user}:${POSTGRES_PASSWORD:-jizzarr_password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-jizzarr}}
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/storage}
      - MASTER_KEY=${MASTER_KEY}
      - THEPORNDB_API_KEY=${THEPORNDB_API_KEY}
      - STASHDB_API_KEY=${STASHDB_API_KEY}
      - STASH_URL=${STASH_URL}
      - EXTENSION_SECRET=${EXTENSION_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ${MEDIA_ROOT:-./media}:/media/storage
      - ./backend:/app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      - db
    networks:
      - jizzarr_network

  frontend:
    build: ./frontend
    container_name: jizzarr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jizzarr_network

volumes:
  jizzarr_db_data:

networks:
  jizzarr_network:
    driver: bridge