<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lensBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E88E5" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Base icon shape (Rounded Square) -->
  <rect width="512" height="512" rx="112" fill="url(#lensBg)" />
  
  <!-- Camera Lens Glow & Rings -->
  <circle cx="256" cy="256" r="160" fill="url(#lensGlow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-opacity="0.9" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.5" />
  
  <!-- Center Eye / Reflection -->
  <circle cx="256" cy="256" r="50" fill="#FFFFFF" stroke="#BBDEFB" stroke-width="4" />
  <circle cx="236" cy="236" r="15" fill="#E3F2FD" />
</svg>